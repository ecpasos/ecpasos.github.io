<!-- Custom head elements for Eugenio Pasos's Portfolio -->
<!-- Mermaid.js for Native Interactive Diagrams & Flowcharts -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  
  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    securityLevel: 'loose',
    themeVariables: {
      darkMode: true,
      background: '#0a1626',
      primaryColor: '#0f233d',
      primaryTextColor: '#f0f9ff',
      primaryBorderColor: '#38bdf8',
      lineColor: '#38bdf8',
      secondaryColor: '#162e4f',
      tertiaryColor: '#081423',
      edgeLabelBackground: '#0a1626',
      clusterBkg: '#0b1c30',
      clusterBorder: '#22d3ee',
      fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
    }
  });

  // Convert markdown code blocks with language-mermaid into mermaid divs
  document.addEventListener('DOMContentLoaded', async () => {
    const mermaidContainers = document.querySelectorAll('div.language-mermaid');
    if (mermaidContainers.length > 0) {
      mermaidContainers.forEach(container => {
        const code = container.textContent.trim();
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = code;
        container.replaceWith(div);
      });
    } else {
      document.querySelectorAll('pre code.language-mermaid').forEach(el => {
        const container = el.closest('pre') || el;
        const code = el.textContent.trim();
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = code;
        container.replaceWith(div);
      });
    }

    try {
      await mermaid.run({ querySelector: '.mermaid' });
    } catch (e) {
      console.warn('Mermaid rendering notice:', e);
    }
  });
</script>

<style>
  html {
    scroll-behavior: smooth;
  }
  .mermaid {
    display: flex;
    justify-content: center;
    background: rgba(10, 22, 38, 0.7);
    border: 1px solid rgba(56, 189, 248, 0.22);
    border-radius: 12px;
    padding: 1.5rem;
    margin: 1.5rem 0;
    overflow-x: auto;
  }
  .mermaid svg {
    max-width: 100%;
    height: auto;
  }
</style>
