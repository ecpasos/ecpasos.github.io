<!-- Custom head elements for Eugenio Pasos's Portfolio -->
<!-- Mermaid.js for Minimal Technical Architecture Diagrams -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  
  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    securityLevel: 'loose',
    themeVariables: {
      darkMode: true,
      background: '#0b0f15',
      primaryColor: '#121822',
      primaryTextColor: '#f4f6f8',
      primaryBorderColor: '#273244',
      lineColor: '#4b586e',
      secondaryColor: '#18202c',
      tertiaryColor: '#0e1219',
      edgeLabelBackground: '#0b0f15',
      clusterBkg: '#0e1219',
      clusterBorder: '#1c2432',
      fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
      fontSize: '13px'
    }
  });

  document.addEventListener('DOMContentLoaded', async () => {
    const containers = document.querySelectorAll('div.language-mermaid');
    if (containers.length > 0) {
      containers.forEach(container => {
        const code = container.textContent.trim();
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = code;
        container.replaceWith(div);
      });
    } else {
      document.querySelectorAll('pre code.language-mermaid').forEach(el => {
        const container = el.closest('pre') || el;
        const code = el.textContent.trim();
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = code;
        container.replaceWith(div);
      });
    }

    try {
      await mermaid.run({ querySelector: '.mermaid' });
    } catch (e) {
      console.warn('Mermaid rendering notice:', e);
    }
  });
</script>

<style>
  html {
    scroll-behavior: smooth;
  }
  .mermaid {
    display: flex;
    justify-content: center;
    background: rgba(17, 23, 33, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 8px;
    padding: 1.5rem 1rem;
    margin: 1.5rem 0;
    overflow-x: auto;
  }
  .mermaid svg {
    max-width: 100%;
    height: auto;
  }
</style>
